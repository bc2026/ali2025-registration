<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 - Voter Registration Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            background: white;
            max-width: 550px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #004aad;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #004aad;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #00327a;
        }
        .row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }
        .row select {
            flex: 1;
        }
        @media (max-width: 600px) {
            .container {
                width: 90%;
                margin: 20px auto;
            }
            .row {
                flex-direction: column;
            }
        }
    </style>

</head>

<body>
    <div class="container">
        <h2>Check Your Voter Registration</h2>
        <p>[DEV]Make sure you're registered to vote in Jersey City!</p>
        <form action="/find-voter" method="POST">
            <input type="text" name="first_name" placeholder="First Name" required>
            <input type="text" name="last_name" placeholder="Last Name" required>
            <label for="dob">Date of Birth</label>
            <input type="date" name="dob" required>

            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="phone_no" placeholder="Phone Number" required>
            <input type="text" name="address" placeholder="Address" required>
            
            <div class="row">
                <select name="residence_city" required>
                    <option value="Jersey City" selected>Jersey City</option>
                </select>
                <select name="state" required>
                    <option value="NJ" selected>New Jersey</option>
                </select>
            </div>
            
            <input type="text" name="residence_zip" placeholder="Zip Code" required>
            <button type="submit">Verify Here!</button>
        </form>
    </div>
</body>
</html>
