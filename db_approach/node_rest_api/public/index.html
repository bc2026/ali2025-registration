<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali for Jersey City 2025 - Voter Registration Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #004aad;
        }
        .campaign-logo {
            width: 150px;
            margin-bottom: 20px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #004aad;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #00327a;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- <img src="campaign-logo.png" alt="Ali for Jersey City 2025" class="campaign-logo"> -->
        <h2>Check Your Voter Registration</h2>
        <p>Make sure you're registered to vote in Jersey City!</p>
        
        <form id="userForm">
            <input type="text" id="first_name" placeholder="First Name" required>
            <input type="text" id="last_name" placeholder="Last Name" required>
            <input type="date" id="dob", placeholder="Date of Birth" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone_no" placeholder="Phone Number" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
            <input type="text" id="address" placeholder="Address" required>
            <input type="text" id="residence_city" placeholder="City" required>
            <input type="text" id="residence_zip" placeholder="Zip Code" required>
            <select id="state" required>
                <option value="">Select a state</option>
                <option value="NJ">New Jersey</option>
                <option value="NY">New York</option>
                <option value="PA">Pennsylvania</option>
                <option value="CT">Connecticut</option>
            </select>
            <button type="submit">Verify Here!</button>
        </form>
    </div>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        document.getElementById("userForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const formatted_dob = new Date(document.getElementById("dob").value);
            const formData = {
                first_name: document.getElementById("first_name").value.toLowerCase(),
                last_name: document.getElementById("last_name").value.toLowerCase(),
                dob: formatted_dob,
                email: document.getElementById("email").value,
                phone_no: document.getElementById("phone_no").value,
                address: document.getElementById("address").value.toLowerCase(),
                residence_city: document.getElementById("residence_city").value.toLowerCase(),
                residence_zip: document.getElementById("residence_zip").value,
                state: document.getElementById("state").value
            };
            
            if (formData.state !== "NJ") {   
                alert("You must be a resident of New Jersey to vote.");
                return;
            }

            try {
                const response = await fetch("http://20.81.133.31:3000/find-voter", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    alert(result.is_reg ? "You are registered to vote!" : "Voter not found. Please register.");
                } else {
                    alert("Voter not found.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Server error. Try again later.");
            }
        });
    </script>
</body>
</html>
