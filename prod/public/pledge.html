<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pledge to Vote</title>
</head>

<body>

    <h2>Pledge to Vote!</h2>
    <p>Make your commitment to vote by filling out the form below.</p>

    <form id="pledgeForm">
        <label for="pledgeName">Name:</label>
        <input type="text" id="pledgeName" required><br><br>

        <label for="pledgeEmail">Email:</label>
        <input type="email" id="pledgeEmail" required><br><br>

        <label for="pledgeAddress">Address:</label>
        <input type="text" id="pledgeAddress" required><br><br>

        <button type="submit">Pledge Now!</button>
    </form>

    <br>
    <button onclick="window.location.href='index.html'">Go Back to Registration</button>

    <script>
        document.getElementById("pledgeForm").addEventListener("submit", function (event) {
            event.preventDefault();

            let name = document.getElementById("pledgeName").value;
            let email = document.getElementById("pledgeEmail").value;
            let address = document.getElementById("pledgeAddress").value;

            // Send pledge data to the backend
            fetch("http://localhost:3000/save-pledge", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ name, email, address }),
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("pledgeForm").reset();
                })
                .catch(error => console.error("Error:", error));
        });
    </script>

</body>

</html>
