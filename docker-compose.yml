# Full stack on one machine: Postgres + API + nginx frontend share this Compose network.
# Postgres is NOT published to the host by default (only `backend` reaches it via DB_HOST=postgres).
# To open psql from your laptop against the DB, use: docker compose exec postgres psql -U admin -d voter_db
# Or add a compose override: ports: ["127.0.0.1:5432:5432"] under postgres (dev/admin only).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: voter_db
    volumes:
      - canivotenj_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d voter_db"]
      interval: 3s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5002:5002"
    env_file:
      - .env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: ""
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  canivotenj_pgdata:
